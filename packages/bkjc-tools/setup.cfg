[metadata]
name = bkjc_tools
version = 0.0.2
description = BKJC CIMG decoder wrappers
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL 3.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    pillow

[options.packages.find]
include =
    bkjc_tools
    bkjc_tools.*

[options.package_data]
bkjc_tools = dll/x64/*.dll
