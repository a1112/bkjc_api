[metadata]
name = bkjc_database
version = 0.0.3
author = lcx
author_email = 1042815796@qq.com
description = BKVisionAlgorithms
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/a1112/bkjc_api
license = GPL 3.0
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved ::  GPL 3.0
    Operating System :: OS Independent

[options]
packages = find:
install_requires =
    sqlalchemy
    pymssql
    pymysql
    sqlalchemy_utils
    pypattyrn
    cryptography

python_requires = >=3.10
;[options.package_data]
;* = *.dll

[options.packages.find]
include =
    bkjc_database
    bkjc_database.*

[options.package_data]
bkjc_database = NerCarDataBase/config/*.json
