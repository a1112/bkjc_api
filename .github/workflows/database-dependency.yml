name: Installed database dependency
on:
  pull_request:
    paths: ['core/init.py', 'api/**', 'bkjc_database/**', 'tests/**', 'requirements*.txt', 'docs/dependency-consolidation/**', 'scripts/verify_consolidation_346.py', '.github/workflows/database-dependency.yml']
  push:
    branches: [main]
    paths: ['core/init.py', 'api/**', 'bkjc_database/**', 'tests/**', 'requirements*.txt', 'docs/dependency-consolidation/**', 'scripts/verify_consolidation_346.py', '.github/workflows/database-dependency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-contract.txt
      - run: python -m pytest tests/test_database_dependency.py -q
      - run: python scripts/verify_consolidation_346.py docs/dependency-consolidation/bkjc_database/manifest.json
